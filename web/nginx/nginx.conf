server {

  listen 80;
  server_tokens off;

  # Headers are set at server level only: an add_header inside a location
  # block would drop all of these for that location.
  # API, Kratos and companion hosts differ per deployment (config.js), so
  # connect/img/form targets are limited to https rather than named hosts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https:; form-action 'self' https:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }

}
